name: Release

# A chaque tag pousse sur cette branche (ex. : git tag 1.7.10-0.1.0 && git push origin 1.7.10-0.1.0), compile le
# mod avec la version du tag et publie le .jar dans une Release GitHub.
on:
  push:
    tags: ["1.7.10-*", "v1.7.10-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Version du tag
        id: version
        run: |
          # Tags de cette branche : 1.7.10-0.1.0 (ou v1.7.10-0.1.0)
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${TAG#1.7.10-}" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon -Pmod_version=${{ steps.version.outputs.version }}

      - name: Extraire les notes de version du CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "Version $VERSION de NetheryX." > release_notes.md; fi

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          name: NetheryX 1.7.10 - ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: build/libs/netheryx-*.jar
          fail_on_unmatched_files: true
