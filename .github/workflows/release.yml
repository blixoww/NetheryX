name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Git à publier (ex. 1.1.0)"
        required: true
        default: "1.1.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version du tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v3

      - name: Compiler le mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon -Pmod_version=${{ steps.version.outputs.version }}

      - name: Vérifier les JAR générés
        run: |
          find build/libs -maxdepth 1 -type f -name "*.jar" -print
          test -n "$(find build/libs -maxdepth 1 -type f -name 'netheryx-*.jar' -print -quit)"

      - name: Extraire les notes de version du CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Version $VERSION de NetheryX." > release_notes.md
          fi

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NetheryX ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: build/libs/netheryx-*.jar
          fail_on_unmatched_files: true
          overwrite_files: true