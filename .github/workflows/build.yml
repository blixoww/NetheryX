name: Build

# Compile le mod 1.7.10 a chaque push et pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9 tourne en Java 17+ ; le JDK 8 de compilation est telecharge automatiquement (toolchain)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: netheryx-1.7.10-${{ github.sha }}
          path: build/libs/netheryx-*.jar
