name: Build

# Compile le mod a chaque push et pull request (verification continue).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifier les ressources generees
        run: |
          pip install pillow
          python3 tools/generate_resources.py
          python3 tools/check_resources.py
          git diff --exit-code -- src/main/resources ':!*.png' ':!*.nbt'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compiler le mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: netheryx-${{ github.sha }}
          path: build/libs/*.jar
